<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公民マスター①（現代社会・憲法・人権・平和主義）| KATEぷら</title>
<style>
:root{
  --blue:#2fbdea;
  --green:#8dc63f;
  --yellow:#f7d000;
  --ink:#1c3a47;
  --bg:#f2fafd;
  --red:#e05d5d;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;}
header{background:linear-gradient(135deg,var(--blue),#1ea5d4);color:#fff;padding:14px 16px;box-shadow:0 2px 8px rgba(31,120,150,.25);}
.brand{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto;}
.logo{background:#fff;color:var(--blue);font-weight:800;border-radius:10px;padding:4px 10px;font-size:15px;letter-spacing:.5px;white-space:nowrap;}
.logo span{color:var(--green);}
.brand-txt{flex:1;min-width:0;}
.brand-txt h1{font-size:17px;line-height:1.3;}
.brand-txt p{font-size:11px;opacity:.92;}
main{max-width:760px;margin:0 auto;padding:16px 14px 50px;}
.hidden{display:none !important;}

/* ===== home ===== */
.lead{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:0 2px 6px rgba(31,120,150,.08);font-size:13.5px;}
.lead b{color:#1491bd;}
.course-grid{display:grid;grid-template-columns:1fr;gap:12px;}
.course{background:#fff;border-radius:16px;padding:16px;border:2px solid transparent;cursor:pointer;box-shadow:0 2px 8px rgba(31,120,150,.10);transition:transform .12s;position:relative;overflow:hidden;text-align:left;width:100%;font:inherit;color:inherit;}
.course:active{transform:scale(.98);}
.course .pt{font-size:30px;font-weight:900;line-height:1;}
.course .pt small{font-size:14px;font-weight:700;}
.course h2{font-size:16px;margin:6px 0 4px;}
.course p{font-size:12.5px;color:#48616d;}
.course .best{display:inline-block;margin-top:8px;font-size:11.5px;background:#eef7fb;border-radius:999px;padding:2px 10px;color:#1491bd;font-weight:700;}
.course .stripe{position:absolute;top:0;left:0;width:8px;height:100%;}
.c50 .stripe{background:var(--green);} .c50 .pt{color:var(--green);}
.c70 .stripe{background:var(--blue);} .c70 .pt{color:var(--blue);}
.c90 .stripe{background:var(--yellow);} .c90 .pt{color:#d4a900;}
.badge{display:inline-block;font-size:11px;font-weight:800;color:#fff;border-radius:999px;padding:2px 10px;margin-bottom:2px;}
.c50 .badge{background:var(--green);} .c70 .badge{background:var(--blue);} .c90 .badge{background:#d4a900;}
.range-note{margin-top:14px;font-size:11.5px;color:#64808c;text-align:center;}

/* ===== quiz ===== */
#quiz-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
#course-tag{font-size:12px;font-weight:800;color:#fff;border-radius:999px;padding:3px 12px;}
#course-tag.c50{background:var(--green);} #course-tag.c70{background:var(--blue);} #course-tag.c90{background:#d4a900;}
#score-box{font-size:13px;font-weight:800;color:#1491bd;background:#fff;border-radius:999px;padding:3px 12px;box-shadow:0 1px 4px rgba(31,120,150,.12);}
#dots{display:flex;gap:5px;margin-bottom:12px;}
.dot{flex:1;height:7px;border-radius:99px;background:#d7e9f1;}
.dot.done{background:var(--green);}
.dot.now{background:var(--blue);}
.dot.miss{background:#f0b4b4;}
.qcard{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(31,120,150,.10);}
#q-num{font-size:12px;font-weight:800;color:#1491bd;margin-bottom:4px;}
#q-type{display:inline-block;font-size:11px;font-weight:800;background:#fdf3cc;color:#9c7c00;border-radius:6px;padding:1px 8px;margin-left:6px;}
#shiryo{margin:10px 0;}
#shiryo .shiryo-box{border:1.5px solid #cfe6f0;border-radius:12px;padding:10px;background:#fbfeff;}
#shiryo .shiryo-title{font-size:12px;font-weight:800;color:#1491bd;margin-bottom:6px;}
#shiryo svg{width:100%;height:auto;display:block;}
#q-text{font-size:15px;font-weight:700;margin:8px 0 12px;white-space:pre-wrap;}
#q-text .wrong-word{color:var(--red);}
#choices{display:grid;gap:9px;}
.choice{width:100%;text-align:left;background:#f4fafd;border:2px solid #d7e9f1;border-radius:12px;padding:11px 13px;font-size:14px;font-family:inherit;color:var(--ink);cursor:pointer;display:flex;gap:9px;align-items:flex-start;transition:background .1s;}
.choice:active{background:#e5f3f9;}
.choice .mark{font-weight:900;color:var(--blue);flex-shrink:0;}
.choice.correct{background:#f0f8e2;border-color:var(--green);}
.choice.wrongpick{background:#fdeaea;border-color:var(--red);}
.choice.dim{opacity:.5;}
.choice:disabled{cursor:default;}

/* feedback */
#feedback{margin-top:14px;}
.verdict{font-size:19px;font-weight:900;margin-bottom:6px;}
.verdict.ok{color:var(--green);}
.verdict.ng{color:var(--red);}
.gotpt{font-size:12.5px;font-weight:800;color:#d4a900;margin-bottom:8px;}
.expl{background:#eef7fb;border-radius:12px;padding:11px 13px;font-size:13.5px;}
.expl b{color:#1491bd;}
.model-box{margin-top:10px;background:#fffbe8;border:2px solid var(--yellow);border-radius:12px;padding:11px 13px;}
.model-box .mb-title{font-size:12px;font-weight:900;color:#9c7c00;margin-bottom:4px;}
.model-box .mb-text{font-size:14px;font-weight:700;line-height:1.75;}
.ondoku{margin-top:10px;background:linear-gradient(135deg,#8dc63f,#6fae23);color:#fff;border-radius:12px;padding:10px 13px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;}
.ondoku .spk{font-size:20px;}
#next-btn{margin-top:14px;width:100%;background:var(--blue);color:#fff;border:none;border-radius:12px;padding:13px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 3px 0 #1a97c2;}
#next-btn:active{transform:translateY(2px);box-shadow:none;}

/* ===== result ===== */
.result-card{background:#fff;border-radius:16px;padding:22px 16px;text-align:center;box-shadow:0 2px 8px rgba(31,120,150,.10);}
#rank{font-size:56px;font-weight:900;line-height:1;}
#rank.S{color:#d4a900;} #rank.A{color:var(--blue);} #rank.B{color:var(--green);} #rank.C{color:#8aa0ab;}
#stars{font-size:26px;letter-spacing:4px;margin:6px 0;}
#result-msg{font-size:15px;font-weight:800;margin-bottom:4px;}
#result-score{font-size:13.5px;color:#48616d;margin-bottom:6px;}
#result-best{font-size:12px;color:#1491bd;font-weight:700;margin-bottom:12px;}
.review{margin-top:16px;text-align:left;}
.review h3{font-size:13.5px;color:#1491bd;margin-bottom:8px;}
.review-item{background:#fdf6f6;border-left:4px solid var(--red);border-radius:8px;padding:9px 11px;font-size:12.5px;margin-bottom:8px;}
.review-item b{color:#2a7a12;}
.btn-row{display:grid;gap:10px;margin-top:18px;}
.btn{width:100%;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;}
.btn.retry{background:var(--green);color:#fff;box-shadow:0 3px 0 #74a82c;}
.btn.home{background:#e4eef3;color:var(--ink);box-shadow:0 3px 0 #c3d4dc;}
.btn:active{transform:translateY(2px);box-shadow:none;}

/* shiryo tables & flow */
.shiryo-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.shiryo-table th,.shiryo-table td{border:1px solid #cfe6f0;padding:5px 7px;}
.shiryo-table th{background:#e5f3f9;color:#1c5a72;font-size:12px;}
.shiryo-table .blank{color:var(--red);font-weight:900;}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:2px;}
.flow .fbox{background:#e5f3f9;border:1.5px solid #9ed3ea;border-radius:10px;padding:7px 10px;font-size:12.5px;text-align:center;font-weight:700;}
.flow .fbox .blank{color:var(--red);font-weight:900;}
.flow .farrow{text-align:center;color:#1491bd;font-weight:900;font-size:14px;line-height:1.1;}
footer{text-align:center;font-size:11.5px;color:#7a95a1;padding:18px 10px 26px;}
footer b{color:var(--blue);}
@media(min-width:560px){
  .course-grid{grid-template-columns:repeat(3,1fr);}
  .brand-txt h1{font-size:19px;}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">KATE<span>ぷら</span></div>
    <div class="brand-txt">
      <h1>公民マスター①</h1>
      <p>現代社会・日本国憲法・基本的人権・平和主義｜つまずきを、プラスに。</p>
    </div>
  </div>
</header>

<main>
  <!-- ========== HOME ========== -->
  <section id="home">
    <div class="lead">
      目指す点数のコースを選ぼう！同じ範囲を <b>50点（暗記）→ 70点（資料読み取り）→ 90点（説明できる）</b> と段階的にレベルアップしていくよ。各コース10問。
    </div>
    <div class="course-grid">
      <button class="course c50" id="btn-c50" onclick="startCourse('50')">
        <div class="stripe"></div>
        <span class="badge">まずはここから</span>
        <div class="pt">50<small>点コース</small></div>
        <h2>基礎用語をおぼえる</h2>
        <p>基本用語の空所補充。テストに必ず出る用語を確実に！（毎回ランダム10問）</p>
        <span class="best" id="best-50">ベスト：まだ記録なし</span>
      </button>
      <button class="course c70" id="btn-c70" onclick="startCourse('70')">
        <div class="stripe"></div>
        <span class="badge">差がつく</span>
        <div class="pt">70<small>点コース</small></div>
        <h2>資料・グラフを読み取る</h2>
        <p>グラフ・年表・図を見て答える資料問題。読み取りのコツをつかもう！</p>
        <span class="best" id="best-70">ベスト：まだ記録なし</span>
      </button>
      <button class="course c90" id="btn-c90" onclick="startCourse('90')">
        <div class="stripe"></div>
        <span class="badge">説明できたら本物</span>
        <div class="pt">90<small>点コース</small></div>
        <h2>理由・しくみを説明する</h2>
        <p>誤文選択＋記述の模範解答。解説を音読して「書ける」力をつける！</p>
        <span class="best" id="best-90">ベスト：まだ記録なし</span>
      </button>
    </div>
    <p class="range-note">出題範囲：公民 第1〜4章（現代社会と私たちの暮らし／日本国憲法と国民主権／憲法が保障する基本的人権／新しい時代の人権保障と平和主義）</p>
  </section>

  <!-- ========== QUIZ ========== -->
  <section id="quiz" class="hidden">
    <div id="quiz-top">
      <span id="course-tag"></span>
      <span id="score-box">スコア 0</span>
    </div>
    <div id="dots"></div>
    <div class="qcard">
      <div id="q-num"></div>
      <div id="shiryo"></div>
      <div id="q-text"></div>
      <div id="choices"></div>
      <div id="feedback" class="hidden">
        <div id="verdict" class="verdict"></div>
        <div id="gotpt" class="gotpt"></div>
        <div id="expl" class="expl"></div>
        <div id="model-wrap"></div>
        <button id="next-btn" onclick="nextQ()">次へ ▶</button>
      </div>
    </div>
  </section>

  <!-- ========== RESULT ========== -->
  <section id="result" class="hidden">
    <div class="result-card">
      <div id="rank"></div>
      <div id="stars"></div>
      <div id="result-msg"></div>
      <div id="result-score"></div>
      <div id="result-best"></div>
      <div id="review" class="review"></div>
      <div class="btn-row">
        <button class="btn retry" id="retry-btn" onclick="retry()">もう一度チャレンジ</button>
        <button class="btn home" onclick="goHome()">コース選択にもどる</button>
      </div>
    </div>
  </section>
</main>

<footer>
  <b>KATEぷら</b>｜つまずきを、プラスに。<br>公民マスター①（定期テスト対策 総まとめ範囲）
</footer>

<script>
"use strict";
/* ================================================================
   公民マスター①  50点=基礎暗記 / 70点=資料読み取り / 90点=説明・記述
   ================================================================ */

/* ---------- 50点コース：基礎用語（プールからランダム10問） ---------- */
const POOL50 = [
 {q:"人や商品、お金、情報などが国境をこえて移動し、世界の一体化が進むことを何という？",
  c:["情報化","グローバル化","国際分業","多文化共生"],a:1,
  e:"国境をこえた移動＝<b>グローバル化</b>。交通やインターネットの発達で進んだよ。"},
 {q:"それぞれの国や地域が、競争力のある産業に力を入れて生産し、貿易によって交換し合うことを何という？",
  c:["国際競争","国際協力","国際分業","規制緩和"],a:2,
  e:"得意なものを作って交換し合う＝<b>国際分業</b>。競い合うのは「国際競争」。"},
 {q:"情報を正しく読み取り、活用する力を何という？",
  c:["デジタルデバイド","メディアリテラシー","ビッグデータ","IoT"],a:1,
  e:"<b>メディアリテラシー</b>。情報格差は「デジタルデバイド」。"},
 {q:"あらゆる物がインターネットでつながるしくみを何という？",
  c:["AI","SNS","ICT","IoT"],a:3,
  e:"Internet of Things＝<b>IoT</b>。AIは人工知能、ICTは情報通信技術。"},
 {q:"合計特殊出生率の低下による少子化と、平均寿命ののびによる高齢化が進んだ社会を何という？",
  c:["少子高齢社会","情報社会","格差社会","多文化社会"],a:0,
  e:"<b>少子高齢社会</b>。社会保障費が増え、一人当たりの負担が大きくなる。"},
 {q:"親と子ども、あるいは夫婦だけの家族を何という？",
  c:["拡大家族","単独世帯","核家族","大家族"],a:2,
  e:"<b>核家族</b>世帯の割合が増加している。一人暮らし（単独世帯）も増加中。"},
 {q:"能や歌舞伎、年中行事など、長い歴史の中でつちかわれ、人々に受けつがれてきた文化を何という？",
  c:["多文化","伝統文化","異文化","大衆文化"],a:1,
  e:"<b>伝統文化</b>。文化財は「文化財保護法」で保存・活用される。"},
 {q:"文化財の保存と活用について定めた法律は？",
  c:["文化財保護法","教育基本法","環境基本法","生活保護法"],a:0,
  e:"<b>文化財保護法</b>。少子高齢化や過疎化で伝統文化のにない手が減っている。"},
 {q:"社会集団の中で対立が生じたとき、話し合いによって目指すものは？",
  c:["合意","効率","公正","契約"],a:0,
  e:"対立 → 話し合い → <b>合意</b>。そのとき「効率と公正」の考え方で判断する。"},
 {q:"採決のしかたのうち「多数決」で大切にしなければならないことは？",
  c:["全会一致にすること","少数意見の尊重","時間をかけないこと","代表者だけで決めること"],a:1,
  e:"多数決は短時間で決められるが、<b>少数意見の尊重</b>が大切。"},
 {q:"『社会契約論』を著し、人民主権を主張した思想家は？",
  c:["ロック","モンテスキュー","ルソー","リンカン"],a:2,
  e:"<b>ルソー</b>＝人民主権。ロック＝社会契約・抵抗権、モンテスキュー＝権力分立。"},
 {q:"『法の精神』で権力分立（三権分立）を主張した思想家は？",
  c:["モンテスキュー","ルソー","ロック","マルクス"],a:0,
  e:"<b>モンテスキュー</b>＝権力分立。セットでロック・ルソーも覚えよう。"},
 {q:"社会契約説をとなえ、抵抗権を主張した思想家は？",
  c:["ルソー","モンテスキュー","リンカン","ロック"],a:3,
  e:"<b>ロック</b>＝社会契約・抵抗権。3人の区別は定期テスト頻出！"},
 {q:"「人たるに値する生存」の保障など、社会権を世界で初めて取り入れた憲法は？",
  c:["マグナ・カルタ","ワイマール憲法","大日本帝国憲法","アメリカ独立宣言"],a:1,
  e:"1919年ドイツの<b>ワイマール憲法</b>。社会権の確立として超頻出。"},
 {q:"1948年に国際連合の総会で採択され、人権の国際的保障のもとになった宣言は？",
  c:["フランス人権宣言","世界人権宣言","アメリカ独立宣言","子どもの権利条約"],a:1,
  e:"<b>世界人権宣言</b>（1948年）。条約化したものが国際人権規約（1966年）。"},
 {q:"日本国憲法の三つの基本原理は、国民主権・平和主義と、もう1つは？",
  c:["天皇主権","三権分立","基本的人権の尊重","地方自治"],a:2,
  e:"<b>国民主権・基本的人権の尊重・平和主義</b>の3つ。絶対に暗記！"},
 {q:"日本国憲法が公布されたのはいつ？",
  c:["1945年8月15日","1946年11月3日","1947年5月3日","1950年11月3日"],a:1,
  e:"<b>公布＝1946年11月3日（文化の日）、施行＝1947年5月3日（憲法記念日）</b>。セットで！"},
 {q:"日本国憲法で、天皇は日本国および日本国民統合の何とされている？",
  c:["元首","主権者","象徴","代表"],a:2,
  e:"<b>象徴</b>（象徴天皇制）。天皇は内閣の助言と承認のもと国事行為のみを行う。"},
 {q:"憲法第13条「すべて国民は、（　）として尊重される。」",
  c:["個人","国民","人間","平等"],a:0,
  e:"<b>個人の尊重</b>（第13条）。幸福追求権の根拠にもなる最重要条文。"},
 {q:"憲法第25条が保障する「健康で（　）な最低限度の生活を営む権利」は？",
  c:["平和的","文化的","経済的","衛生的"],a:1,
  e:"「健康で<b>文化的</b>な最低限度の生活」＝<b>生存権</b>。社会権の中心。"},
 {q:"自由権のうち、居住・移転・職業選択の自由や財産権の保障があてはまるのは？",
  c:["精神活動の自由","身体の自由","経済活動の自由","学問の自由"],a:2,
  e:"<b>経済活動の自由</b>。公共の福祉により精神の自由より広く制限される。"},
 {q:"労働三権は、団結権・団体行動権と、もう1つは？",
  c:["団体交渉権","勤労権","請願権","参政権"],a:0,
  e:"<b>団結権・団体交渉権・団体行動権（争議権）</b>の3つ＝労働基本権。"},
 {q:"国民の三大義務は、普通教育を受けさせる義務・勤労の義務と、もう1つは？",
  c:["投票の義務","納税の義務","兵役の義務","奉仕の義務"],a:1,
  e:"<b>納税の義務</b>（第30条）。大日本帝国憲法の義務は「兵役・納税」だった。"},
 {q:"環境権や知る権利、プライバシーの権利など、憲法に直接規定のない人権をまとめて何という？",
  c:["自然権","社会権","新しい人権","請求権"],a:2,
  e:"<b>新しい人権</b>。幸福追求権（第13条）などが根拠。"},
 {q:"個人が自分の生き方や生活のしかたを自由に決める権利を何という？",
  c:["自己決定権","プライバシーの権利","知る権利","環境権"],a:0,
  e:"<b>自己決定権</b>。インフォームド・コンセントや臓器提供意思表示カードが例。"},

/* SVGグラフ生成ヘルパー */
function barChart(title,labels,values,unit,maxV,color){
  const W=380,H=235,x0=38,x1=366,y0=200,y1=28;
  const n=values.length,bw=Math.min(28,(x1-x0)/n*0.55),gap=(x1-x0)/n;
  let s='<div class="shiryo-title">'+title+'</div><svg viewBox="0 0 '+W+' '+H+'" role="img">';
  for(let g=0;g<=4;g++){const y=y0-(y0-y1)*g/4;
    s+='<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="#dcebf2" stroke-width="1"/>';
    s+='<text x="'+(x0-4)+'" y="'+(y+4)+'" font-size="9" fill="#64808c" text-anchor="end">'+(maxV*g/4)+'</text>';}
  values.forEach((v,i)=>{
    const cx=x0+gap*i+gap/2, h=(y0-y1)*v/maxV, y=y0-h;
    s+='<rect x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="3" fill="'+color+'"/>';
    s+='<text x="'+cx+'" y="'+(y-4)+'" font-size="9" fill="#1c5a72" text-anchor="middle" font-weight="bold">'+v+'</text>';
    s+='<text x="'+cx+'" y="'+(y0+13)+'" font-size="9" fill="#48616d" text-anchor="middle">'+labels[i]+'</text>';});
  s+='<text x="'+x0+'" y="'+(y1-10)+'" font-size="9.5" fill="#64808c">（'+unit+'）</text>';
  s+='<line x1="'+x0+'" y1="'+y0+'" x2="'+x1+'" y2="'+y0+'" stroke="#8aa0ab" stroke-width="1.2"/></svg>';
  return '<div class="shiryo-box">'+s+'</div>';
}
function polyPts(vals,labels,x0,x1,y0,y1,maxV,minV){
  const n=labels.length,gap=(x1-x0)/(n-1);
  return vals.map((v,i)=> v==null?null:[x0+gap*i, y0-(y0-y1)*(v-minV)/(maxV-minV)]);
}
function lineChart(title,labels,series,unit,maxV,minV){
  const W=380,H=250,x0=40,x1=356,y0=195,y1=30;
  let s='<div class="shiryo-title">'+title+'</div><svg viewBox="0 0 '+W+' '+H+'" role="img">';
  for(let g=0;g<=4;g++){const y=y0-(y0-y1)*g/4, lv=minV+(maxV-minV)*g/4;
    s+='<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="#dcebf2"/>';
    s+='<text x="'+(x0-4)+'" y="'+(y+4)+'" font-size="9" fill="#64808c" text-anchor="end">'+lv+'</text>';}
  labels.forEach((lb,i)=>{const x=x0+(x1-x0)/(labels.length-1)*i;
    s+='<text x="'+x+'" y="'+(y0+14)+'" font-size="9" fill="#48616d" text-anchor="middle">'+lb+'</text>';});
  series.forEach(sr=>{
    const pts=polyPts(sr.v,labels,x0,x1,y0,y1,maxV,minV).filter(p=>p);
    s+='<polyline points="'+pts.map(p=>p[0]+','+p[1]).join(' ')+'" fill="none" stroke="'+sr.col+'" stroke-width="2.6" stroke-linejoin="round"/>';
    pts.forEach(p=>{s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="'+sr.col+'"/>';});});
  let lx=x0;
  series.forEach(sr=>{
    s+='<rect x="'+lx+'" y="'+(H-18)+'" width="14" height="4" rx="2" fill="'+sr.col+'"/>';
    s+='<text x="'+(lx+18)+'" y="'+(H-12)+'" font-size="10" fill="#1c5a72">'+sr.name+'</text>';
    lx+=18+sr.name.length*10+18;});
  s+='<text x="'+x0+'" y="'+(y1-12)+'" font-size="9.5" fill="#64808c">（'+unit+'）</text>';
  s+='<line x1="'+x0+'" y1="'+y0+'" x2="'+x1+'" y2="'+y0+'" stroke="#8aa0ab" stroke-width="1.2"/></svg>';
  return '<div class="shiryo-box">'+s+'</div>';
}

function pyramidChart(){
  // 下→上（年少→高齢）の帯の幅

    {name:"A",w:[100,92,84,76,68,58,48,38,26,12]},          // 富士山型
    {name:"B",w:[62,70,76,80,80,76,68,56,38,18]},           // つりがね型
    {name:"C",w:[36,42,50,60,72,80,76,66,52,26]},           // つぼ型

  const W=380,H=190;
  let s='<div class="shiryo-title">◆人口ピラミッドの模式図（下が年少・上が高齢）</div><svg viewBox="0 0 '+W+' '+H+'" role="img">';

    const cx=70+gi*120;
    sh.w.forEach((w,bi)=>{

    s+='<text x="'+cx+'" y="182" font-size="13" font-weight="bold" fill="#1c5a72" text-anchor="middle">'+sh.name+'</text>';});

  s+='</svg>';
  return '<div class="shiryo-box">'+s+'</div>';
}

/* ================= エンジン ================= */
const COURSE_INFO={
  "50":{label:"50点コース｜基礎暗記", cls:"c50", pts:10},
  "70":{label:"70点コース｜資料読み取り", cls:"c70", pts:15},
  "90":{label:"90点コース｜説明・記述", cls:"c90", pts:20},
};
const N=10;
let S=null;

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function el(id){return document.getElementById(id);}
function show(id){el(id).classList.remove("hidden");}
function hide(id){el(id).classList.add("hidden");}

function startCourse(course){
  let qs;
  if(course==="50") qs=shuffle(POOL50).slice(0,N);
  else if(course==="70") qs=Q70.slice();
  else qs=Q90.slice();
  S={course,qs,idx:0,correct:0,streak:0,score:0,wrongs:[],results:[]};
  hide("home");hide("result");show("quiz");
  const info=COURSE_INFO[course];
  const tag=el("course-tag");
  tag.textContent=info.label;
  tag.className="";
  tag.classList.add(info.cls);
  tag.id="course-tag";
  renderQ();
  window.scrollTo(0,0);
}

function renderDots(){
  const d=el("dots");d.innerHTML="";
  for(let i=0;i<N;i++){
    const sp=document.createElement("span");
    sp.className="dot";
    if(i<S.idx) sp.classList.add(S.results[i]?"done":"miss");
    else if(i===S.idx) sp.classList.add("now");
    d.appendChild(sp);
  }
}

function renderQ(){
  const q=S.qs[S.idx];
  renderDots();
  el("score-box").textContent="スコア "+S.score;
  el("q-num").innerHTML="第"+(S.idx+1)+"問 / "+N+(q.type?'<span id="q-type">'+q.type+'</span>':"");
  el("shiryo").innerHTML = q.sh ? (typeof q.sh==="function"?q.sh():q.sh) : "";
  el("q-text").innerHTML = q.q.replace("【誤っているもの】",'<span class="wrong-word">【誤っているもの】</span>');
  const order=shuffle([0,1,2,3]);
  S.order=order;
  const marks=["ア","イ","ウ","エ"];
  const box=el("choices");box.innerHTML="";
  order.forEach((oi,di)=>{
    const b=document.createElement("button");
    b.className="choice";
    b.innerHTML='<span class="mark">'+marks[di]+'</span><span>'+q.c[oi]+'</span>';
    b.onclick=()=>answer(di,b);
    box.appendChild(b);
  });
  hide("feedback");
  window.scrollTo({top:0,behavior:"smooth"});
}

function answer(di,btn){
  const q=S.qs[S.idx];
  const picked=S.order[di];
  const ok=picked===q.a;
  const buttons=el("choices").querySelectorAll(".choice");
  buttons.forEach((b,i)=>{
    b.disabled=true;
    if(S.order[i]===q.a) b.classList.add("correct");
    else if(i===di) b.classList.add("wrongpick");
    else b.classList.add("dim");
  });
  S.results.push(ok);
  let got=0;
  if(ok){
    S.correct++;S.streak++;
    got=COURSE_INFO[S.course].pts+(S.streak>=2?(S.streak-1)*5:0);
    S.score+=got;
  }else{
    S.streak=0;
    S.wrongs.push({q:q.q,ans:q.c[q.a]});
  }
  el("verdict").textContent= ok ? "⭕ 正解！" : "❌ ざんねん…";
  el("verdict").className="verdict "+(ok?"ok":"ng");
  el("gotpt").textContent= ok ? "+"+got+"pt"+(S.streak>=2?"（"+S.streak+"連続正解ボーナス！）":"") : "正解は上の緑の選択肢だよ";
  el("expl").innerHTML="💡 "+q.e;
  const mw=el("model-wrap");
  if(q.m){
    mw.innerHTML='<div class="model-box"><div class="mb-title">✍️ 実際に記述・説明するならこう書く！</div><div class="mb-text">'+q.m+'</div></div>'+
      '<div class="ondoku"><span class="spk">📢</span><span>模範解答を声に出して2回音読しよう！読めたら「次へ」</span></div>';
  }else{
    mw.innerHTML="";
  }
  el("next-btn").textContent = S.idx===N-1 ? "結果を見る ▶" : "次へ ▶";
  show("feedback");
  renderDotsAfter();
}
function renderDotsAfter(){
  const d=el("dots").children;
  d[S.idx].className="dot "+(S.results[S.idx]?"done":"miss");
}

function nextQ(){
  S.idx++;
  if(S.idx>=N){showResult();}
  else{renderQ();}
}

function showResult(){
  hide("quiz");show("result");
  const c=S.correct;
  let rank,msg;
  if(c===10){rank="S";msg="パーフェクト！この範囲はマスターだ！";}
  else if(c>=8){rank="A";msg="すばらしい！あと少しで満点！";}
  else if(c>=6){rank="B";msg="いい調子！まちがえた問題を復習しよう";}
  else{rank="C";msg="ここからが本番！もう一度チャレンジしよう";}
  const rk=el("rank");rk.textContent=rank;rk.className=rank;
  el("stars").textContent="★".repeat(Math.max(1,Math.ceil(c/2)))+"☆".repeat(5-Math.max(1,Math.ceil(c/2)));
  el("result-msg").textContent=msg;
  el("result-score").textContent="正解 "+c+" / "+N+"問　｜　スコア "+S.score+"pt";
  const key="koumin1-best-"+S.course;
  const prev=Number(localStorage.getItem(key)||0);
  if(S.score>prev){localStorage.setItem(key,String(S.score));
    el("result-best").textContent="🎉 ベストスコア更新！（"+prev+" → "+S.score+"）";
  }else{
    el("result-best").textContent="ベストスコア："+Math.max(prev,S.score)+"pt";
  }
  const rv=el("review");
  if(S.wrongs.length){
    rv.innerHTML="<h3>📒 まちがえた問題の復習</h3>"+
      S.wrongs.map(w=>'<div class="review-item">'+w.q.replace("【誤っているもの】","【誤っているもの】")+'<br><b>正解：'+w.ans+'</b></div>').join("");
  }else{
    rv.innerHTML="";
  }
  updateBest();
  window.scrollTo(0,0);
}

function retry(){startCourse(S.course);}
function goHome(){hide("quiz");hide("result");show("home");updateBest();window.scrollTo(0,0);}

function updateBest(){
  ["50","70","90"].forEach(cs=>{
    const v=localStorage.getItem("koumin1-best-"+cs);
    el("best-"+cs).textContent = v ? "ベスト："+v+"pt" : "ベスト：まだ記録なし";
  });
}
updateBest();
</script>
